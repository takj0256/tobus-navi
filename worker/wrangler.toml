name = "tobus-realtime-proxy"
main = "worker.js"
compatibility_date = "2026-07-01"

[triggers]
# WorkerはGTFS-RT収集だけを担当する。重いプロファイル集計はWSLで行う。
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tobus-phase11"
database_id = "6888b506-2f45-4913-849e-57d9aff6c3a1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EVENT_BUCKET"
bucket_name = "tobus-phase11-events"

[vars]
TRAFFIC_MONTHLY_LIMIT = "20000"
TRAFFIC_STOP_RATIO = "0.95"
TRAFFIC_SOFT_RATIO = "0.80"
TRAFFIC_CACHE_SECONDS = "600"
TRAFFIC_TIMEOUT_MS = "5000"
HOLIDAY_DATE_KEYS = ""
WEATHER_ENABLED = "true"
WEATHER_LATITUDE = "35.6895"
WEATHER_LONGITUDE = "139.6917"
WEATHER_REFRESH_MINUTES = "15"
WEATHER_TIMEOUT_MS = "5000"
R2_MAINTENANCE_ENABLED = "true"
R2_DAILY_MAINTENANCE_ENABLED = "false"
