<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a5ea8">
  <meta name="description" content="選択した都バス系統の停留所と走行経路を道路地図上に表示">
  <title>路線マップ | 都バスナビ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./css/route-map.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <header class="map-header">
    <div class="map-nav">
      <a class="back-link" href="./index.html">‹ 戻る</a>
      <div class="map-heading"><h1 id="mapTitle">路線マップ</h1><p id="mapSubtitle">路線データを読み込んでいます…</p></div>
    </div>
    <div id="patternWrap" class="map-controls" hidden>
      <label for="patternSelect">経路</label><select id="patternSelect"></select>
    </div>
    <p id="mapStatus" class="map-status" role="status" aria-live="polite">地図を準備しています…</p>
  </header>
  <main id="routeMap" aria-label="選択した系統の道路地図"></main>
  <noscript>路線マップの表示にはJavaScriptを有効にしてください。</noscript>
  <script type="module" src="./js/route-map.js"></script>
</body>
</html>
